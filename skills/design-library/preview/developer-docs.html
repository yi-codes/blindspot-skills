          <h1>从一个可验证的最小任务开始</h1>
          <p class="frame-lede">安装依赖、运行检查、读取结果。每一步都能独立验证，失败时给出下一步。</p>

          <pre><code>npm install runtime-kit</code></pre>
          <h2>运行</h2>
          <pre><code>runtime-kit check --strict</code></pre>

            </article>

              <h3>失败</h3>
              <p>错误信息包含位置和恢复命令。</p>
